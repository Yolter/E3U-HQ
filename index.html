<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E3U HQ</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;
font-family:Arial,Helvetica,sans-serif;
color:white;
overflow:hidden;
}

.slider{
position:fixed;
inset:0;
z-index:-2;
background-size:cover;
background-position:center;
transition:background-image .8s ease-in-out;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.55);
z-index:-1;
}

.topbar{
position:absolute;
top:25px;
left:50%;
transform:translateX(-50%);
width:min(1200px,92%);
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:42px;
font-weight:900;
color:#f0c541;
line-height:.9;
}

.logo span{
display:block;
font-size:18px;
color:white;
}

.right{
display:flex;
align-items:center;
gap:16px;
}

.langs button{
background:#111;
color:white;
border:1px solid #333;
padding:8px 12px;
border-radius:12px;
cursor:pointer;
font-weight:bold;
}

.langs button.active{
background:#f0c541;
color:black;
}

.music{
display:flex;
align-items:center;
gap:8px;
}

.music input{
width:90px;
}

.center{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero{
max-width:800px;
}

.hero h1{
font-size:72px;
margin-bottom:10px;
}

.hero p{
font-size:22px;
color:#ddd;
margin-bottom:40px;
}

.login-btn{
background:#f0c541;
color:black;
font-size:24px;
font-weight:bold;
padding:18px 50px;
border:none;
border-radius:18px;
cursor:pointer;
transition:.2s;
}

.login-btn:hover{
transform:translateY(-2px);
box-shadow:0 0 25px rgba(240,197,65,.5);
}

.time{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
font-size:18px;
color:#ddd;
}

.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
background:rgba(0,0,0,.5);
border:none;
color:white;
font-size:34px;
padding:12px 18px;
cursor:pointer;
border-radius:14px;
}

#prev{left:20px}
#next{right:20px}

@media(max-width:768px){

.logo{font-size:34px}

.hero h1{font-size:46px}

.hero p{font-size:18px}

.topbar{
flex-direction:column;
gap:15px;
}

.time{
bottom:15px;
font-size:15px;
}
}
</style>
</head>

<body>

<div class="slider" id="slider"></div>
<div class="overlay"></div>

<div class="topbar">

<div class="logo">
E3U
<span>HQ</span>
</div>

<div class="right">

<div class="music">
🎵
<input id="volume" type="range" min="0" max="1" step="0.01">
</div>

<div class="langs">
<button class="lang active" data-lang="ru">RU</button>
<button class="lang" data-lang="en">EN</button>
<button class="lang" data-lang="es">ES</button>
<button class="lang" data-lang="jp">JP</button>
</div>

</div>
</div>

<div class="center">
<div class="hero">
<h1 id="title">E3U HQ</h1>
<p id="subtitle">Founder Control Center</p>

<button class="login-btn" id="loginBtn"
onclick="location.href='pages/home.html'">
Войти в HQ
</button>
</div>
</div>

<button class="arrow" id="prev">❮</button>
<button class="arrow" id="next">❯</button>

<div class="time" id="clock"></div>

<audio id="bgMusic" loop>
<source src="assets/music/e3u-theme.mp3" type="audio/mpeg">
</audio>

<script>

const images=[
"assets/images/hero1.jpg",
"assets/images/hero2.jpg",
"assets/images/hero3.jpg"
];

let current=0;

const slider=document.getElementById("slider");

function showSlide(i){
current=(i+images.length)%images.length;
slider.style.backgroundImage=`url(${images[current]})`;
}

showSlide(0);

setInterval(()=>showSlide(current+1),5000);

document.getElementById("next").onclick=()=>showSlide(current+1);
document.getElementById("prev").onclick=()=>showSlide(current-1);

const audio=document.getElementById("bgMusic");
const volume=document.getElementById("volume");

audio.volume=Number(localStorage.getItem("musicVolume"))||0.4;
volume.value=audio.volume;

volume.oninput=()=>{
audio.volume=volume.value;
localStorage.setItem("musicVolume",volume.value);
};

document.addEventListener("click",()=>{
audio.play().catch(()=>{});
},{once:true});

const LANG={

ru:{
title:"E3U HQ",
subtitle:"Founder Control Center",
login:"Войти в HQ"
},

en:{
title:"E3U HQ",
subtitle:"Founder Control Center",
login:"Enter HQ"
},

es:{
title:"E3U HQ",
subtitle:"Centro del Fundador",
login:"Entrar al HQ"
},

jp:{
title:"E3U HQ",
subtitle:"HQ 管理センター",
login:"HQに入る"
}

};

const buttons=document.querySelectorAll(".lang");

function setLang(lang){

localStorage.setItem("lang",lang);

buttons.forEach(b=>b.classList.remove("active"));

document.querySelector(`[data-lang="${lang}"]`).classList.add("active");

document.getElementById("title").textContent=LANG[lang].title;
document.getElementById("subtitle").textContent=LANG[lang].subtitle;
document.getElementById("loginBtn").textContent=LANG[lang].login;

}

buttons.forEach(btn=>btn.onclick=()=>setLang(btn.dataset.lang));

setLang(localStorage.getItem("lang")||"ru");

function updateClock(){

const now=new Date();

const text=now.toLocaleString("ru-RU",{
weekday:"long",
day:"numeric",
month:"long",
hour:"2-digit",
minute:"2-digit",
timeZone:"Europe/Madrid"
});

document.getElementById("clock").textContent=text;

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
