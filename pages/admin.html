<section class="panel">

  <h2>👑 Штаб Founder</h2>

  <div class="dashboard">

    <div class="stat-card">
      <span>Founder</span>
      <h3 id="founderStat">Yolter</h3>
    </div>

    <div class="stat-card">
      <span>Всего игроков</span>
      <h3 id="totalPlayers">0</h3>
    </div>

    <div class="stat-card">
      <span>R4+</span>
      <h3 id="officerPlayers">0</h3>
    </div>

    <div class="stat-card">
      <span>Ждут аттестацию</span>
      <h3 id="waitingPlayers">0</h3>
    </div>

  </div>

  <div class="admin-actions">

    <button id="addPlayer" class="btn gold">
      ➕ Добавить игрока
    </button>

    <input id="searchPlayer" placeholder="Поиск игрока">

  </div>

  <div id="playerList"></div>

</section>

<script>
(async function () {

  while (!window.E3U_DB) {
    await new Promise(r => setTimeout(r, 100));
  }

  const {
    db,
    collection,
    getDocs,
    addDoc,
    doc,
    updateDoc,
    deleteDoc
  } = window.E3U_DB;

  const playerList = document.getElementById("playerList");
  const searchInput = document.getElementById("searchPlayer");

  let players = [];

  function roleColor(role) {
    return ({
      Founder: "#f0c341",
      R4: "#ff944d",
      R3: "#4da3ff",
      R2: "#57d17a",
      R1: "#8d8d8d"
    })[role] || "#888";
  }

  async function loadPlayers() {

    playerList.innerHTML = "";
    players = [];

    const snap = await getDocs(collection(db, "users"));

    snap.forEach(item => {
      players.push({
        id: item.id,
        ...item.data()
      });
    });

    render();
  }

  function render() {

    playerList.innerHTML = "";

    const filter = searchInput.value.toLowerCase();

    const list = players.filter(p =>
      p.name.toLowerCase().includes(filter)
    );

    document.getElementById("totalPlayers").textContent = players.length;
    document.getElementById("officerPlayers").textContent =
      players.filter(p => ["Founder", "R4"].includes(p.role)).length;

    document.getElementById("waitingPlayers").textContent =
      players.filter(p => !p.exam).length;

    list.forEach(player => {

      const percent = Math.round(
        ((player.rules ? 1 : 0) +
         (player.truck ? 1 : 0) +
         (player.bank ? 1 : 0) +
         (player.exam ? 1 : 0)) / 4 * 100
      );

      const card = document.createElement("div");
      card.className = "player-card";

      card.innerHTML = `
        <div class="player-top">

          <div>

            <h3>${player.name}</h3>

            <span class="roleBadge"
            style="background:${roleColor(player.role)}22;color:${roleColor(player.role)};">
              ${player.role}
            </span>

          </div>

          <div class="player-actions">

            <button class="editBtn">✏️</button>
            <button class="deleteBtn">🗑️</button>

          </div>

        </div>

        <div class="progress">
          <div style="width:${percent}%"></div>
        </div>

        <small>Аттестация: ${percent}%</small>
      `;

      card.querySelector(".editBtn").onclick = async () => {

        const newName = prompt("Новый ник", player.name);
        if (newName === null) return;

        const newRole = prompt("Новая роль", player.role);
        if (newRole === null) return;

        await updateDoc(doc(db, "users", player.id), {
          name: newName.trim() || player.name,
          role: newRole.trim() || player.role
        });

        if (window.E3U_CORE) {
          await E3U_CORE.addActivity(
            "user_edit",
            `${player.name} изменён`,
            newRole
          );
        }

        await loadPlayers();
      };

      card.querySelector(".deleteBtn").onclick = async () => {

        if (!confirm(`Удалить ${player.name}?`)) return;

        await deleteDoc(doc(db, "users", player.id));

        if (window.E3U_CORE) {
          await E3U_CORE.addActivity(
            "user_delete",
            `${player.name} удалён`,
            player.role
          );
        }

        await loadPlayers();
      };

      playerList.appendChild(card);

    });

  }

  searchInput.oninput = render;

  document.getElementById("addPlayer").onclick = async () => {

    const name = prompt("Ник");
    if (!name) return;

    const role = prompt("Роль", "R1");
    if (!role) return;

    await addDoc(collection(db, "users"), {
      name: name.trim(),
      role: role.trim(),
      rules: false,
      truck: false,
      bank: false,
      exam: false
    });

    if (window.E3U_CORE) {
      await E3U_CORE.addActivity(
        "user_add",
        `${name} добавлен в состав`,
        role
      );
    }

    await loadPlayers();
  };

  await loadPlayers();

})();
</script>
