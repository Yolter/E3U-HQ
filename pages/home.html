<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E3U HQ</title>

  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="layout">

  <aside id="sidebar"></aside>

  <main class="content">

    <div class="topbar">
      <div id="clock">Загрузка...</div>
    </div>

    <div class="hero">
      <img src="../assets/images/hero3.jpg" alt="E3U HQ">
      <div class="hero-overlay">
        <h1>E3U HQ</h1>
        <p>Founder Control Center</p>
      </div>
    </div>

    <div class="grid stats">

      <div class="card">
        <span>Founder</span>
        <h2 id="founderName">Yolter</h2>
      </div>

      <div class="card">
        <span>Всего игроков</span>
        <h2 id="totalPlayers">0</h2>
      </div>

      <div class="card">
        <span>R4+</span>
        <h2 id="officerCount">0</h2>
      </div>

      <div class="card">
        <span>Ждут аттестацию</span>
        <h2 id="waitingCount">0</h2>
      </div>

    </div>

    <div class="card">
      <h2>⚡ Быстрые действия</h2>

      <div class="quick-grid">
        <button onclick="location.href='truck.html'">🚚 Truck</button>
        <button onclick="location.href='bank.html'">🏦 Банк</button>
        <button onclick="location.href='roster.html'">👥 Состав</button>
        <button onclick="location.href='admin.html'">👑 Штаб</button>
      </div>
    </div>

    <div class="card">
      <h2>📢 Последняя активность</h2>
      <div id="recentActivity">
        Пока активности нет.
      </div>
    </div>

  </main>

</div>

<script type="module">

import { db } from "../js/firebase.js";
import {
collection,
getDocs,
query,
orderBy,
limit
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

async function refreshHome(){

  let total = 0;
  let officers = 0;
  let waiting = 0;

  const players = await getDocs(collection(db,"players"));

  players.forEach(doc=>{

    total++;

    const role=(doc.data().role||"").toUpperCase();

    if(role.startsWith("R4") || role==="FOUNDER"){
      officers++;
    }

    if(doc.data().status==="waiting"){
      waiting++;
    }

  });

  document.getElementById("totalPlayers").textContent=total;
  document.getElementById("officerCount").textContent=officers;
  document.getElementById("waitingCount").textContent=waiting;

  const recent=document.getElementById("recentActivity");

  const activityQ=query(
    collection(db,"activity"),
    orderBy("time","desc"),
    limit(5)
  );

  const activity=await getDocs(activityQ);

  recent.innerHTML="";

  activity.forEach(doc=>{

    const d=doc.data();

    recent.innerHTML+=`
      <div class="activity-item">
        <strong>${d.text || "Активность"}</strong><br>
        <small>${d.role || ""}</small>
      </div>
    `;

  });

  if(activity.empty){
    recent.innerHTML="Пока активности нет.";
  }

}

refreshHome();

</script>

<script>
function updateClock(){

const now=new Date();

document.getElementById("clock").textContent=
now.toLocaleString("ru-RU",{
weekday:"long",
day:"numeric",
month:"long",
hour:"2-digit",
minute:"2-digit",
timeZone:"Europe/Madrid"
});

}

updateClock();
setInterval(updateClock,1000);
</script>

<script src="../js/router.js"></script>

</body>
</html>
