<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Банк — E3U HQ</title>

<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="layout">

<aside id="sidebar"></aside>

<main class="content">

<div class="page-header">
<h1>🏦 Банк семьи</h1>
<p>Учёт недельной сдачи ресурсов.</p>
</div>

<div class="grid stats">

<div class="card">
<span>Карго</span>
<h2 id="cargo">0M</h2>
</div>

<div class="card">
<span>Амуниция</span>
<h2 id="ammo">0M</h2>
</div>

<div class="card">
<span>Металл</span>
<h2 id="metal">0M</h2>
</div>

<div class="card">
<span>Алмазы</span>
<h2 id="diamonds">0M</h2>
</div>

</div>

<div class="card">
<row justify=between align=center>
  <title size=md>Неделя 1</title>
  <title size=md><text id="progressText" inline>0 / 96</text></title>
</row>

<box background="#1a1a1a" radius=full height=10>
<box id="progressBar" background="#f0c541" radius=full height="100%" width="0%"></box>
</box>
</div>

<div class="card">

<row justify=between align=center>
  <title size=md>Игроки</title>

  <button id="refreshPlayers" variant=outline size=sm>Обновить</button>
</row>

<div id="playersList"></div>

</div>

<div class="card">
<title size=md>История</title>
<div id="historyList"></div>
</div>

</main>

</div>

<script type="module">

import { db } from "../js/firebase.js";

import {
collection,
doc,
getDoc,
getDocs,
updateDoc,
setDoc,
increment,
addDoc,
query,
where,
orderBy,
limit
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const GIVE = 10000000;

async function loadBalance(){

const snap=await getDoc(doc(db,"bank_balance","current"));

if(!snap.exists()) return;

const data=snap.data();

cargo.textContent=(data.cargo/1000000)+"M";
ammo.textContent=(data.ammo/1000000)+"M";
metal.textContent=(data.metal/1000000)+"M";
diamonds.textContent=(data.diamonds/1000000)+"M";

}

async function loadCycle(){

const snap=await getDoc(doc(db,"bank_cycle","week1"));

if(!snap.exists()) return;

const data=snap.data();

progressText.textContent=`${data.submitted}/${data.totalPlayers}`;

const percent=(data.submitted/data.totalPlayers)*100;

progressBar.style.width=percent+"%";

}

async function loadPlayers(){

const list=document.getElementById("playersList");

list.innerHTML="Загрузка...";

const q=query(collection(db,"users"));

const snap=await getDocs(q);

list.innerHTML="";

snap.forEach(docSnap=>{

const p=docSnap.data();

const row=document.createElement("div");

row.className="playerRow";

row.innerHTML=`
<div>
<b>${p.nickname}</b><br>
<small>${p.rank}</small>
</div>

<label>
<input type="checkbox" ${p.bankSubmitted?"checked":""}>
Сдал
</label>
`;

const check=row.querySelector("input");

check.onchange=()=>togglePlayer(docSnap.id,p.bankSubmitted);

list.appendChild(row);

});

}

async function togglePlayer(id,current){

const userRef=doc(db,"users",id);

await updateDoc(userRef,{
bankSubmitted:!current
});

const balanceRef=doc(db,"bank_balance","current");
const cycleRef=doc(db,"bank_cycle","week1");

if(!current){

await updateDoc(balanceRef,{
cargo:increment(GIVE),
ammo:increment(GIVE),
metal:increment(GIVE),
diamonds:increment(GIVE)
});

await updateDoc(cycleRef,{
submitted:increment(1)
});

await addDoc(collection(db,"bank_history"),{
player:id,
action:"submit",
time:Date.now()
});

}else{

await updateDoc(balanceRef,{
cargo:increment(-GIVE),
ammo:increment(-GIVE),
metal:increment(-GIVE),
diamonds:increment(-GIVE)
});

await updateDoc(cycleRef,{
submitted:increment(-1)
});

}

await loadBalance();
await loadCycle();
await loadPlayers();
await loadHistory();

}

async function loadHistory(){

const box=document.getElementById("historyList");

box.innerHTML="";

const q=query(
collection(db,"bank_history"),
orderBy("time","desc"),
limit(20)
);

const snap=await getDocs(q);

snap.forEach(d=>{

const data=d.data();

const item=document.createElement("div");

item.innerHTML=`
<b>${data.player}</b><br>
<small>Сдал недельный пакет</small>
`;

box.appendChild(item);

});

}

refreshPlayers.onclick=loadPlayers;

loadBalance();
loadCycle();
loadPlayers();
loadHistory();

</script>

<script src="../js/router.js"></script>

</body>
</html>
